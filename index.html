<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neurosift v3 check</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de;
    --side: #f6f8fa; --active: #ddf4ff; --accent: #0969da;
    --pass: #1a7f37; --fail: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d;
      --side: #161b22; --active: #1f3a5f; --accent: #4493f8;
      --pass: #3fb950; --fail: #f85149;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  a { color: var(--accent); }
  nav {
    width: 240px; flex: none; overflow-y: auto;
    background: var(--side); border-right: 1px solid var(--line); padding: 12px 0;
  }
  nav h1 { font-size: 15px; margin: 0 16px 8px; }
  nav h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 14px 16px 4px;
  }
  nav a {
    display: block; padding: 3px 16px; color: var(--fg); text-decoration: none;
  }
  nav a:hover { background: var(--line); }
  nav a.active { background: var(--active); font-weight: 600; }
  nav a { display: flex; gap: 6px; }
  .st { flex: none; width: 1em; text-align: center; color: var(--muted); }
  .st.pass { color: var(--pass); }
  .st.fail { color: var(--fail); }
  #summary { margin: 0 16px; font-size: 12px; color: var(--muted); }
  #summary .pass { color: var(--pass); }
  #summary .fail { color: var(--fail); }
  #record { margin-top: 6px; font-size: 13px; color: var(--muted); }
  #record .label.pass { color: var(--pass); font-weight: 600; }
  #record .label.fail { color: var(--fail); font-weight: 600; }
  #latest { margin-top: 2px; white-space: pre-wrap; max-height: 4.2em; overflow: hidden; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header {
    flex: none; padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; gap: 16px; align-items: flex-start;
  }
  header .info { flex: 1; min-width: 0; }
  header h2 { margin: 0 0 4px; font-size: 17px; }
  header ul { margin: 0; padding-left: 18px; color: var(--muted); }
  header .nav { flex: none; display: flex; gap: 6px; align-items: center; color: var(--muted); }
  button {
    font: inherit; color: var(--fg); background: var(--side);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer;
  }
  .panes { flex: 1; min-height: 0; display: flex; }
  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pane + .pane { border-left: 3px solid var(--line); }
  .pane .bar {
    flex: none; padding: 4px 10px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--line); display: flex; gap: 10px;
  }
  .pane .bar b { color: var(--fg); }
  .pane iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  @media (max-width: 900px) {
    body { flex-direction: column; height: auto; overflow: auto; }
    nav { width: auto; max-height: 30vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .panes { flex-direction: column; }
    .pane { height: 80vh; }
    .pane + .pane { border-left: 0; border-top: 3px solid var(--line); }
  }
</style>
</head>
<body>
<nav id="nav"><h1>Neurosift v3 check</h1><div id="summary"></div></nav>
<main>
  <header>
    <div class="info">
      <h2 id="title"></h2>
      <ul id="check"></ul>
      <div id="record"></div>
    </div>
    <div class="nav">
      <button id="prev" title="Previous feature (k)">&larr;</button>
      <span id="pos"></span>
      <button id="next" title="Next feature (j)">&rarr;</button>
    </div>
  </header>
  <div class="panes">
    <div class="pane">
      <div class="bar"><b>v2</b><a id="v2link" target="_blank" rel="noopener">open in new tab</a></div>
      <iframe id="v2frame" title="Neurosift v2"></iframe>
    </div>
    <div class="pane">
      <div class="bar"><b>v3</b><a id="v3link" target="_blank" rel="noopener">open in new tab</a></div>
      <iframe id="v3frame" title="Neurosift v3"></iframe>
    </div>
  </div>
</main>
<script>
const REPO = "magland/neurosift-v3-check";
const API = `https://api.github.com/repos/${REPO}`;
const STATUS = {
  pass: { mark: "✓", text: "Pass" },
  fail: { mark: "✗", text: "Fail" },
  unchecked: { mark: "○", text: "Not checked" },
  unknown: { mark: "·", text: "Status unavailable" },
};

// All issues, open and closed, by number; null if GitHub can't be reached
// (for example over the unauthenticated limit of 60 requests an hour).
async function loadIssues() {
  const issues = new Map();
  try {
    for (let page = 1; ; page++) {
      const r = await fetch(`${API}/issues?state=all&per_page=100&page=${page}`);
      if (!r.ok) return null;
      const batch = await r.json();
      for (const i of batch) if (!i.pull_request) issues.set(i.number, i);
      if (batch.length < 100) return issues;
    }
  } catch {
    return null;
  }
}

// Closed means it passed; open with the fail label means it failed.
function statusOf(issue) {
  if (!issue) return "unknown";
  if (issue.state === "closed") return "pass";
  if (issue.labels.some((l) => l.name === "fail")) return "fail";
  return "unchecked";
}

(async () => {
  const [data, issues] = await Promise.all([
    fetch("features.json").then((r) => r.json()),
    loadIssues(),
  ]);
  const features = data.features;
  const $ = (id) => document.getElementById(id);

  // Sidebar, grouped in the order groups first appear.
  const nav = $("nav");
  let group = null;
  for (const f of features) {
    if (f.group !== group) {
      group = f.group;
      const h = document.createElement("h2");
      h.textContent = group;
      nav.appendChild(h);
    }
    const a = document.createElement("a");
    a.href = `#${f.id}`;
    const st = issues ? statusOf(issues.get(f.issue)) : "unknown";
    const mark = document.createElement("span");
    mark.className = `st ${st}`;
    mark.textContent = STATUS[st].mark;
    mark.title = STATUS[st].text;
    const label = document.createElement("span");
    label.textContent = f.title;
    a.append(mark, label);
    a.dataset.id = f.id;
    nav.appendChild(a);
  }

  const summary = $("summary");
  if (issues) {
    const n = { pass: 0, fail: 0, unchecked: 0, unknown: 0 };
    for (const f of features) n[statusOf(issues.get(f.issue))]++;
    summary.innerHTML =
      `<span class="pass">${n.pass} pass</span> · <span class="fail">${n.fail} fail</span> · ${n.unchecked + n.unknown} not checked`;
  } else {
    summary.textContent = "Couldn't load results from GitHub.";
  }

  // The feature's status and issue link, then the newest comment on the issue.
  let shown = null;
  const showRecord = async (f) => {
    shown = f.id;
    const rec = $("record");
    rec.replaceChildren();
    if (!f.issue) return;
    const issue = issues?.get(f.issue);
    const st = statusOf(issue);
    const a = document.createElement("a");
    a.href = `https://github.com/${REPO}/issues/${f.issue}`;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = `Record a check in issue #${f.issue}`;
    const label = document.createElement("span");
    label.className = `label ${st}`;
    label.textContent = STATUS[st].text;
    rec.append(label, " · ", a);
    if (!issue?.comments) return;
    try {
      const r = await fetch(`${API}/issues/${f.issue}/comments?per_page=1&page=${issue.comments}`);
      const [c] = r.ok ? await r.json() : [];
      if (!c || shown !== f.id) return;
      const latest = document.createElement("div");
      latest.id = "latest";
      latest.textContent = `${c.user.login}, ${c.created_at.slice(0, 10)}: ${c.body}`;
      rec.append(latest);
    } catch {
      // The status line is enough without the comment.
    }
  };

  const current = () => {
    const id = decodeURIComponent(location.hash.slice(1));
    return Math.max(0, features.findIndex((f) => f.id === id));
  };
  const go = (i) => {
    location.hash = features[(i + features.length) % features.length].id;
  };

  const show = () => {
    const i = current();
    const f = features[i];
    document.title = `${f.title} · Neurosift v3 check`;
    $("title").textContent = f.title;
    $("check").replaceChildren(...(f.check ?? []).map((c) => {
      const li = document.createElement("li");
      li.textContent = c;
      return li;
    }));
    $("pos").textContent = `${i + 1} / ${features.length}`;
    showRecord(f);
    for (const v of ["v2", "v3"]) {
      const url = data[v] + (f[`${v}Path`] ?? f.path);
      $(`${v}link`).href = url;
      $(`${v}frame`).src = url;
    }
    for (const a of nav.querySelectorAll("a")) {
      a.classList.toggle("active", a.dataset.id === f.id);
    }
    nav.querySelector("a.active")?.scrollIntoView({ block: "nearest" });
  };

  $("prev").onclick = () => go(current() - 1);
  $("next").onclick = () => go(current() + 1);
  document.addEventListener("keydown", (e) => {
    if (e.target.closest?.("input, textarea")) return;
    if (e.key === "j") go(current() + 1);
    if (e.key === "k") go(current() - 1);
  });
  window.addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
